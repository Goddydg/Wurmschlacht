<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wurmschlacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen game. Team strip on top, battlefield canvas fills the middle, thumb controls sit at the bottom. */
:root{
  --bg:#f2efe4; --panel:#e7e2d2; --card:#fbf9f1; --fg:#2b261e; --muted:#6c6454; --line:#d3ccb8;
  --accent:#c2431c; --on-accent:#fff7ee;
  --t0:#e4572e; --t1:#2e86de; --t2:#8a4fd0;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --ui:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171510; --panel:#25221b; --card:#2f2b22; --fg:#f1ecde; --muted:#a79f8c; --line:#403a2e;
    --accent:#ff8353; --on-accent:#24110a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171510; --panel:#25221b; --card:#2f2b22; --fg:#f1ecde; --muted:#a79f8c; --line:#403a2e;
  --accent:#ff8353; --on-accent:#24110a; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}

.hud{display:flex;gap:8px;padding-block:8px;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{flex:1;min-width:0;display:grid;gap:4px;padding:6px 8px;border-radius:8px;background:var(--panel);border:2px solid transparent}
.chip.on{border-color:var(--c)}
.chip.out{opacity:.4}
.chip .nm{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.chip .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .nm span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .hp{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.chip .hp b{display:block;height:100%;background:var(--c);width:100%;transition:width .4s}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{position:relative;flex:1;min-height:0;background:#cfe0d6;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.badge{position:absolute;top:8px;padding:4px 10px;border-radius:999px;background:rgba(30,26,20,.74);color:#f6f1e4;
  font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.2}
.timer{left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:400;font-size:18px;min-width:44px;justify-content:center}
.timer.retreat{background:rgba(194,67,28,.9)}
.wind{right:max(8px,env(safe-area-inset-right,0px))}
.map{left:max(8px,env(safe-area-inset-left,0px));border:0;cursor:pointer;font-family:inherit;touch-action:manipulation}
.map[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.map:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wbar{position:relative;width:60px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}
.wbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#f6f1e4}
.wbar b{position:absolute;top:0;bottom:0;background:#ffb23d;border-radius:4px}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:10px;
  background:rgba(30,26,20,.85);color:#f6f1e4;font-weight:700;text-align:center;pointer-events:none}

.controls{display:grid;gap:8px;padding-block:8px;background:var(--panel);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.weapons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn{position:relative;overflow:hidden;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;touch-action:none;cursor:pointer}
.btn small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;line-height:1}
.btn.down{background:var(--line)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wbtn{height:38px;flex-direction:row;gap:6px;font-size:14px}
.wbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wbtn[disabled]{opacity:.35}
.fire{background:var(--accent);color:var(--on-accent);border-color:transparent;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.fire.down{background:var(--accent)}
.fire::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);background:rgba(0,0,0,.3)}
.fire span{position:relative}
.fire small{position:relative;color:inherit;opacity:.8}
.controls[data-off="1"] .btn{opacity:.45;pointer-events:none}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;background:var(--bg);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
@supports (background:color-mix(in srgb,red 50%,blue)){
  .overlay{background:color-mix(in srgb,var(--bg) 90%,transparent)}
}
.card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;box-sizing:border-box}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:36px}
h2{font-size:28px}
p{margin:0;color:var(--muted);line-height:1.35}
.names{display:grid;gap:8px}
.names label{display:flex;align-items:center;gap:10px}
.names i{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c)}
.names input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;-webkit-user-select:text;user-select:text}
.names input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.seg button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{height:54px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.ghost{height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;cursor:pointer}
.band{height:12px;border-radius:6px;background:var(--c,var(--accent))}
.big{font-family:var(--display);font-size:30px;line-height:1.05;text-wrap:balance}
.facts{display:flex;gap:16px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.chip .hp b{transition:none}}
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<main id="app">
  <header class="hud" id="hud"></header>
  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="badge map" id="map" type="button" aria-pressed="false">Karte</button>
    <div class="badge timer" id="timer">30</div>
    <div class="badge wind" id="wind"><span>Wind</span><span class="wbar"><b id="windfill"></b></span></div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <section class="controls" id="controls" data-off="1">
    <div class="weapons" id="weapons">
      <button class="btn wbtn on" data-w="0">Bazooka</button>
      <button class="btn wbtn" data-w="1">Granate</button>
      <button class="btn wbtn" data-w="2" id="wdyn">Dynamit ×2</button>
    </div>
    <div class="pad">
      <button class="btn" data-hold="left" aria-label="Nach links"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 7 12l8 7z" fill="currentColor"/></svg><small>Links</small></button>
      <button class="btn" data-hold="right" aria-label="Nach rechts"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l8 7-8 7z" fill="currentColor"/></svg><small>Rechts</small></button>
      <button class="btn" data-hold="up" aria-label="Höher zielen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 15l7-8 7 8z" fill="currentColor"/></svg><small>Höher</small></button>
      <button class="btn" data-hold="down" aria-label="Tiefer zielen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 9l7 8 7-8z" fill="currentColor"/></svg><small>Tiefer</small></button>
    </div>
    <div class="row2">
      <button class="btn" id="jump"><span>Sprung</span></button>
      <button class="btn fire" id="fire"><span id="firetxt">Feuer</span><small id="firehint">Halten für Kraft</small></button>
    </div>
  </section>

  <div class="overlay" id="setup">
    <div class="card">
      <h1>Wurmschlacht</h1>
      <p>Ein Handy, drei Spieler. Nach jedem Zug wird weitergereicht. Wer als Letzter noch einen Wurm hat, gewinnt.</p>
      <div class="names">
        <label><i style="--c:var(--t0)"></i><input id="n0" maxlength="14" placeholder="Spieler 1" aria-label="Name Spieler 1"></label>
        <label><i style="--c:var(--t1)"></i><input id="n1" maxlength="14" placeholder="Spieler 2" aria-label="Name Spieler 2"></label>
        <label><i style="--c:var(--t2)"></i><input id="n2" maxlength="14" placeholder="Spieler 3" aria-label="Name Spieler 3"></label>
      </div>
      <div>
        <div class="lbl">Würmer pro Team</div>
        <div class="seg" id="per">
          <button data-per="2">2</button><button data-per="3" class="on">3</button><button data-per="4">4</button>
        </div>
      </div>
      <button class="go" id="start">Spiel starten</button>
    </div>
  </div>

  <div class="overlay" id="handoff" hidden>
    <div class="card" id="handcard">
      <div class="band"></div>
      <div class="lbl">Handy weitergeben an</div>
      <div class="big" id="handname">Spieler</div>
      <div class="facts"><span id="handworm">Wurm</span><span id="handwind">Wind</span></div>
      <button class="go" id="ready">Los</button>
    </div>
  </div>

  <div class="overlay" id="winner" hidden>
    <div class="card" id="wincard">
      <div class="band"></div>
      <h2 id="wintext">Gewonnen</h2>
      <button class="go" id="rematch">Revanche</button>
      <button class="ghost" id="menu">Neue Einstellungen</button>
    </div>
  </div>
</main>

<script>
(function () {
'use strict';
const W = 1400, H = 640, WATERY = H - 40, R = 8;
const COL = ['#e4572e', '#2e86de', '#8a4fd0'];
const NAMES = ['Wurmi', 'Krümel', 'Kringel', 'Fritz', 'Otto', 'Lotte', 'Berta', 'Emil', 'Hugo', 'Frieda', 'Egon', 'Paula', 'Moritz', 'Resi', 'Knut', 'Tilda'];
const WEAPONS = [
  { n: 'Bazooka', r: 34, dmg: 50 },
  { n: 'Granate', r: 40, dmg: 45 },
  { n: 'Dynamit', r: 62, dmg: 80 }
];
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const cv = $('cv'), ctx = cv.getContext('2d');
let dpr = 1, cw = 300, ch = 300, scale = 1, baseScale = 1, fitScale = 0.3;
const G = {
  phase: 'setup', teams: ['Spieler 1', 'Spieler 2', 'Spieler 3'], worms: [], proj: [], parts: [],
  team: -1, cur: null, wind: 0, timeLeft: 0, retreat: 0, aim: 35, power: 0, charging: false, weapon: 0,
  cam: { x: W / 2, y: H / 2 }, shake: 0, t: 0, settle: 0, per: 3, wptr: [0, 0, 0], ammo: [2, 2, 2], overview: false
};
const keys = { left: false, right: false, up: false, down: false };
let terrain, tctx, mask, hs;

/* ---------- terrain ---------- */
function genTerrain() {
  terrain = document.createElement('canvas');
  terrain.width = W; terrain.height = H;
  tctx = terrain.getContext('2d');
  mask = new Uint8Array(W * H);
  hs = new Array(W);
  const ph = [rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28)];
  const dips = [rnd(380, 560), rnd(840, 1020)];
  for (let x = 0; x < W; x++) {
    let h = H * 0.5 + Math.sin(x / 190 + ph[0]) * 62 + Math.sin(x / 83 + ph[1]) * 26 + Math.sin(x / 37 + ph[2]) * 8;
    const e = Math.min(x, W - x);
    if (e < 130) { const t = (130 - e) / 130; h += t * t * (3 - 2 * t) * 300; }
    dips.forEach((c) => { h += 330 * Math.exp(-Math.pow((x - c) / 46, 2)); });
    hs[x] = Math.round(h);
  }
  const g = tctx.createLinearGradient(0, H * 0.35, 0, H);
  g.addColorStop(0, '#8d6643'); g.addColorStop(0.5, '#6b4a34'); g.addColorStop(1, '#46301f');
  tctx.fillStyle = g;
  tctx.beginPath(); tctx.moveTo(0, H);
  for (let x = 0; x < W; x++) tctx.lineTo(x, hs[x]);
  tctx.lineTo(W, H); tctx.closePath(); tctx.fill();
  tctx.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 900; i++) {
    tctx.fillStyle = Math.random() < 0.5 ? 'rgba(40,26,16,.22)' : 'rgba(190,150,100,.16)';
    tctx.beginPath(); tctx.arc(rnd(0, W), rnd(H * 0.3, H), rnd(1.5, 5), 0, 6.283); tctx.fill();
  }
  tctx.strokeStyle = '#7da04a'; tctx.lineWidth = 7; tctx.lineJoin = 'round';
  tctx.beginPath();
  for (let x = 0; x < W; x += 2) { if (x === 0) tctx.moveTo(x, hs[x] + 2); else tctx.lineTo(x, hs[x] + 2); }
  tctx.stroke();
  tctx.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 3; k++) {
    let cx = rnd(160, W - 160), cy = hs[Math.floor(cx)] + rnd(90, 140);
    for (let i = 0; i < 12; i++) {
      tctx.beginPath(); tctx.arc(cx, cy, rnd(13, 20), 0, 6.283); tctx.fill();
      cx += rnd(10, 22); cy += rnd(-8, 8);
    }
  }
  tctx.globalCompositeOperation = 'source-over';
  const d = tctx.getImageData(0, 0, W, H).data;
  for (let i = 0; i < W * H; i++) mask[i] = d[i * 4 + 3] > 128 ? 1 : 0;
}
function solid(x, y) {
  x = x | 0; y = y | 0;
  if (x < 0 || x >= W || y < 0) return false;
  if (y >= H) return true;
  return mask[y * W + x] === 1;
}
function surfaceY(x) {
  for (let y = 0; y < H; y++) if (solid(x, y)) return y;
  return H;
}
function carve(cx, cy, r) {
  tctx.save();
  tctx.globalCompositeOperation = 'destination-out';
  tctx.beginPath(); tctx.arc(cx, cy, r, 0, 6.283); tctx.fill();
  tctx.restore();
  tctx.save();
  tctx.globalCompositeOperation = 'source-atop';
  tctx.strokeStyle = 'rgba(30,20,12,.55)'; tctx.lineWidth = 4;
  tctx.beginPath(); tctx.arc(cx, cy, r + 2, 0, 6.283); tctx.stroke();
  tctx.restore();
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r) mask[y * W + x] = 0;
  }
}

/* ---------- worms ---------- */
function makeWorms() {
  G.worms = [];
  const total = 3 * G.per, pts = [];
  let tries = 0;
  while (pts.length < total && tries < 5000) {
    tries++;
    const x = Math.floor(rnd(50, W - 50));
    if (surfaceY(x) > WATERY - 70) continue;
    if (Math.abs(surfaceY(x - 8) - surfaceY(x + 8)) > 14) continue;
    if (pts.some((p) => Math.abs(p - x) < (tries > 2500 ? 36 : 90))) continue;
    pts.push(x);
  }
  while (pts.length < total) pts.push(Math.floor(rnd(60, W - 60)));
  pts.sort(() => Math.random() - 0.5);
  const nm = NAMES.slice().sort(() => Math.random() - 0.5);
  pts.forEach((x, i) => {
    G.worms.push({ team: i % 3, name: nm[i % nm.length], x: x, y: Math.min(surfaceY(x), WATERY - 40) - 9, vx: 0, vy: 0, fx: 0,
      hp: 100, alive: true, face: x < W / 2 ? 1 : -1, ground: false, walk: 0 });
  });
}
const bodyHit = (x, y) => solid(x - R + 1, y - 3) || solid(x + R - 1, y - 3) || solid(x, y - R + 1) ||
  solid(x - R + 3, y - R + 3) || solid(x + R - 3, y - R + 3) || solid(x - R + 1, y + 2) || solid(x + R - 1, y + 2);
const feet = (x, y) => solid(x - 4, y + R) || solid(x, y + R) || solid(x + 4, y + R);

function hurt(w, d) {
  if (d <= 0 || !w.alive) return;
  w.hp -= d;
  floatText(w.x, w.y - 18, '-' + d, '#fff');
}
function land(w) {
  if (!w.ground && w.vy > 7) hurt(w, Math.floor((w.vy - 7) * 7));
  w.vy = 0; w.ground = true;
}
function stepWorm(w) {
  if (!w.alive) return;
  let vx = w.vx;
  if (w.ground) {
    if (w.walk) vx = w.walk * 0.62;
    else { vx *= 0.7; if (Math.abs(vx) < 0.05) vx = 0; }
  }
  w.vx = vx;
  w.fx += vx;
  const mv = Math.trunc(w.fx); w.fx -= mv;
  const sg = Math.sign(mv);
  for (let i = 0; i < Math.abs(mv); i++) {
    if (!bodyHit(w.x + sg, w.y)) {
      w.x += sg;
      if (w.ground && !feet(w.x, w.y)) {
        for (let d = 1; d <= 4; d++) if (feet(w.x, w.y + d)) { w.y += d; break; }
      }
    } else {
      let climbed = false;
      for (let up = 1; up <= 4; up++) {
        if (!bodyHit(w.x + sg, w.y - up)) { w.x += sg; w.y -= up; climbed = true; break; }
      }
      if (!climbed) { w.vx = Math.abs(w.vx) > 1 ? -w.vx * 0.3 : 0; w.fx = 0; break; }
    }
  }
  w.x = clamp(w.x, R, W - R);
  let guard = 0;
  while (solid(w.x, w.y + R - 1) && guard++ < 6) w.y -= 1;
  w.vy = Math.min(12, w.vy + 0.27);
  if (w.vy >= 0 && feet(w.x, w.y)) {
    land(w);
  } else {
    w.ground = false;
    const steps = Math.ceil(Math.abs(w.vy));
    for (let i = 0; i < steps; i++) {
      if (w.vy > 0) {
        w.y += 1;
        if (feet(w.x, w.y)) { land(w); break; }
      } else {
        if (bodyHit(w.x, w.y - 1)) { w.vy = 0; break; }
        w.y -= 1;
      }
    }
  }
}

/* ---------- particles ---------- */
function puff(x, y, type, n, spd, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = Math.random() * spd;
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (type === 'dirt' ? 1.4 : 0), life: 0, max: rnd(20, 46), type: type, r: rnd(2, 5), col: col });
  }
}
function splash(x) {
  for (let i = 0; i < 16; i++) G.parts.push({ x: x + rnd(-8, 8), y: WATERY, vx: rnd(-1.4, 1.4), vy: -rnd(2, 5), life: 0, max: rnd(25, 45), type: 'splash', r: rnd(2, 4), col: '#bfe3f2' });
}
function floatText(x, y, txt, col) {
  G.parts.push({ x: x, y: y, vx: 0, vy: -0.7, life: 0, max: 60, type: 'txt', txt: txt, col: col });
}
function stepParts() {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life++;

  G.worms.forEach((w) => { if (w.alive && w !== G.cur) drawWorm(w); });
  if (G.cur && G.cur.alive) drawWorm(G.cur);
  G.proj.forEach(drawProj);
  drawParts();
  waterLayer('rgba(58,134,168,.72)', 6, 3.5);
}
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  baseScale = Math.max(cw / 560, ch / H * 0.72);
  fitScale = Math.min(cw / W, ch / H);
  scale = G.overview ? fitScale : baseScale;
}

/* ---------- input ---------- */
document.querySelectorAll('[data-hold]').forEach((b) => {
  const k = b.dataset.hold;
  const off = () => { keys[k] = false; b.classList.remove('down'); };
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    keys[k] = true; b.classList.add('down');
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => b.addEventListener(ev, off));
});
const jb = $('jump');
jb.addEventListener('pointerdown', (e) => { e.preventDefault(); jb.classList.add('down'); jump(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => jb.addEventListener(ev, () => jb.classList.remove('down')));
const fb = $('fire');
fb.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { fb.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  fb.classList.add('down'); pressFire();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => fb.addEventListener(ev, () => { fb.classList.remove('down'); releaseFire(); }));
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => {
  if (G.phase !== 'aim' || b.disabled) return;
  G.weapon = +b.dataset.w; updateWeapons();
}));
$('controls').addEventListener('contextmenu', (e) => e.preventDefault());
const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (keyMap[e.key]) { keys[keyMap[e.key]] = true; e.preventDefault(); }
  else if (e.key === 'j' || e.key === 'J') jump();
  else if (e.key === ' ' && !e.repeat) { e.preventDefault(); pressFire(); }
});
window.addEventListener('keyup', (e) => {
  if (keyMap[e.key]) keys[keyMap[e.key]] = false;
  else if (e.key === ' ') releaseFire();
});
document.querySelectorAll('#per button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('#per button').forEach((x) => x.classList.toggle('on', x === b));
}));
$('map').addEventListener('click', () => setOverview(!G.overview));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && G.phase !== 'setup') keepAwake(); });
$('start').addEventListener('click', startGame);
$('ready').addEventListener('click', startTurn);
$('rematch').addEventListener('click', startGame);
$('menu').addEventListener('click', () => { $('winner').hidden = true; $('setup').hidden = false; setPhase('setup'); });

/* ---------- boot ---------- */
try {
  const saved = JSON.parse(localStorage.getItem('wurm-names') || 'null');
  if (Array.isArray(saved)) saved.forEach((n, i) => { if ($('n' + i) && typeof n === 'string') $('n' + i).value = n; });
} catch (e) { /* optional */ }
genTerrain();
new ResizeObserver(resize).observe($('stage'));
window.addEventListener('resize', resize);
resize();
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= 16.667 && n < 6) { tick(); acc -= 16.667; n++; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
